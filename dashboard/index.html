const ORDEM_PROG = ['CadÚnico','Tarifa Social de Energia','Bolsa Família','Farmácia Popular','Documentação básica','BPC','Pé-de-Meia'];
const progId = Object.fromEntries(Object.entries(D.prog).map(([k,v])=>[v,+k]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- índices auxiliares ---------- */
const docsPorCaso = {}; D.docs.forEach(([c,d]) => (docsPorCaso[c] ||= new Set()).add(d));
const destPorCaso = {}; D.enc.forEach(([c,p,de]) => (destPorCaso[c] ||= new Set()).add(de));
const lemPorCaso = {}; D.enc.forEach(([c,p,de,r,l]) => (lemPorCaso[c] ||= new Set()).add(l));
const progPorCaso = {}; D.itens.forEach(([c,p]) => (progPorCaso[c] ||= new Set()).add(p));
const subs = [...new Set(Object.values(D.distritos).map(d=>d.s))].sort((a,b)=>a.localeCompare(b,'pt'));

/* ---------- estado dos filtros ---------- */
const F = {sub:null, dist:null, uni:null, prog:null, doc:null, dest:null, lem:null, cob:null};

function distritosGeo(){
  // distritos que passam por subprefeitura / distrito / unidade
  if (F.uni) return new Set([D.unidades[F.uni][1]]);
  return new Set(Object.keys(D.distritos).map(Number).filter(k =>
    (!F.sub || D.distritos[k].s === F.sub) && (!F.dist || k === F.dist)));
}
function casoPassa(id, c, geo, ignorar){
  if (!geo.has(c[0])) return false;
  if (F.uni && c[1] !== F.uni) return false;
  if (F.prog && ignorar!=='prog' && !(progPorCaso[id] && progPorCaso[id].has(F.prog))) return false;
  if (F.doc!==null && ignorar!=='doc' && !(docsPorCaso[id] && docsPorCaso[id].has(F.doc))) return false;
  if (F.dest!==null && ignorar!=='dest' && !(destPorCaso[id] && destPorCaso[id].has(F.dest))) return false;
  if (F.lem!==null && ignorar!=='lem' && !(lemPorCaso[id] && lemPorCaso[id].has(F.lem))) return false;
  if (F.cob!==null && ignorar!=='cob' && c[6]!==F.cob) return false;
  return true;
}
function casosFiltrados(geo, ignorar){
  const s = new Set();
  for (const [id,c] of Object.entries(D.casos)) if (casoPassa(+id, c, geo, ignorar)) s.add(+id);
  return s;
}

/* ---------- filtros (dropdowns) ---------- */
const $ = id => document.getElementById(id);
function opts(sel, itens, atual){
  sel.innerHTML = '<option value="">Todos</option>' + itens.map(([v,t]) => `<option value="${esc(v)}"${String(v)===String(atual)?' selected':''}>${esc(t)}</option>`).join('');
  sel.classList.toggle('on', atual!==null && atual!=='' );
}
function montarFiltros(){
  opts($('f-sub'), subs.map(s=>[s,s]), F.sub);
  const ds = Object.entries(D.distritos).filter(([k,d]) => !F.sub || d.s===F.sub)
     .sort((a,b)=>a[1].n.localeCompare(b[1].n,'pt')).map(([k,d])=>[k,d.n]);
  opts($('f-dist'), ds, F.dist);
  const us = Object.entries(D.unidades).filter(([k,u]) => {
     const d = D.distritos[u[1]]; return d && (!F.sub || d.s===F.sub) && (!F.dist || u[1]===F.dist);
  }).sort((a,b)=>a[1][0].localeCompare(b[1][0],'pt')).map(([k,u])=>[k,u[0]]);
  opts($('f-uni'), us, F.uni);
  opts($('f-prog'), ORDEM_PROG.map(p=>[progId[p],p]), F.prog);
}
$('f-sub').onchange = e => { F.sub = e.target.value || null; F.dist = null; F.uni = null; render(); };
$('f-dist').onchange = e => { F.dist = e.target.value ? +e.target.value : null; F.uni = null; render(); };
$('f-uni').onchange = e => { F.uni = e.target.value ? +e.target.value : null; render(); };
$('f-prog').onchange = e => { F.prog = e.target.value ? +e.target.value : null; render(); };
$('limpar').onclick = () => { Object.keys(F).forEach(k=>F[k]=null); render(); };
function escolherDistrito(k){
  if (F.dist === k) { F.dist = null; }
  else { F.dist = k; if (F.sub && D.distritos[k].s !== F.sub) F.sub = null; }
  F.uni = null; render();
}

/* ---------- tooltip ---------- */
const tip = $('tip');
function mostrarTip(e, html){ tip.innerHTML = html; tip.style.display='block'; moverTip(e); }
function moverTip(e){
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 6) x = e.clientX - w - 14;
  if (y + h > innerHeight - 6) y = e.clientY - h - 14;
  tip.style.left = Math.max(6,x)+'px'; tip.style.top = Math.max(6,y)+'px';
}
function esconderTip(){ tip.style.display='none'; }
function ligarTip(el, fn){ el.onmouseenter = e => mostrarTip(e, fn()); el.onmousemove = moverTip; el.onmouseleave = esconderTip; }
const linha = (a,b) => `<div class="r"><span>${a}</span><b>${b}</b></div>`;

/* ---------- mapa ---------- */
const svg = $('mapa'); svg.setAttribute('width', D.mapW); svg.setAttribute('height', D.mapH);
svg.setAttribute('viewBox', `0 0 ${D.mapW} ${D.mapH}`);
const pathEls = {};
for (const [k,d] of Object.entries(D.paths)) {
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', d); svg.appendChild(p); pathEls[k] = p;
  p.onclick = () => { esconderTip(); escolherDistrito(+k); };
}
$('legenda-mapa').innerHTML = CLASSES.map(c => `<span class="lg"><i style="background:${COR_CLASSE[c]};${c==='baixa'?'outline:1px solid #D0D5DD':''}"></i>${c}</span>`).join('');

/* ---------- render ---------- */
function render(){
  esconderTip();
  montarFiltros();
  const geo = distritosGeo();
  const casos = casosFiltrados(geo);
  const progOk = p => !F.prog || p === F.prog;

  // KPIs
  let ativos = 0, risco = 0;
  casos.forEach(id => { const c = D.casos[id]; if (c[5]) { ativos++; if (c[4]) risco++; } });
  const semAcessoAtivos = new Set();
  D.itens.forEach(([c,p,s]) => { if (casos.has(c) && progOk(p) && D.SIT[s]!=='Já recebe' && D.casos[c][5]) semAcessoAtivos.add(c); });
  const semDoc = new Set(); D.docs.forEach(([c,d]) => { if (casos.has(c) && (F.doc===null || d===F.doc)) semDoc.add(c); });
  let encTot = 0, encConc = 0;
  D.enc.forEach(([c,p,de,r,l]) => { if (casos.has(c) && progOk(p) && (F.dest===null || de===F.dest) && (F.lem===null || l===F.lem)) { encTot++; if (D.RES[r]==='Concluído') encConc++; } });
  $('k1').textContent = fmt(ativos);
  $('k2').textContent = fmt(semAcessoAtivos.size);
  $('k3').textContent = fmt(semDoc.size);
  $('k4').textContent = fmt(risco);
  $('k5').textContent = fmt(encConc);
  ligarTip($('k1'), () => `<div class="h">Pessoas acompanhadas</div>${linha('Casos ativos', fmt(ativos))}${linha('Total de casos (inclui encerrados)', fmt(casos.size))}`);
  ligarTip($('k2'), () => `<div class="h">Direitos sem acesso</div>${linha('Pessoas ativas com ao menos 1 direito sem acesso', fmt(semAcessoAtivos.size))}${linha('% das acompanhadas', ativos?pct(semAcessoAtivos.size/ativos):'–')}`);
  ligarTip($('k3'), () => `<div class="h">Pessoas sem documento</div>${linha('Pessoas com documento pendente', fmt(semDoc.size))}${linha('% das acompanhadas', ativos?pct(semDoc.size/ativos):'–')}`);
  ligarTip($('k4'), () => `<div class="h">Casos em área de risco</div>${linha('Casos ativos em setor R3/R4', fmt(risco))}`);
  ligarTip($('k5'), () => `<div class="h">Encaminhamentos concluídos</div>${linha('Concluídos', fmt(encConc))}${linha('Encaminhados', fmt(encTot))}${linha('% concluídos', encTot?pct(encConc/encTot):'–')}`);

  // contagem de casos ativos por distrito (para tooltip do mapa)
  const casosDist = {}; casos.forEach(id => { const c = D.casos[id]; if (c[5]) casosDist[c[0]] = (casosDist[c[0]]||0)+1; });
  const casosSemGeo = casosFiltrados(new Set(Object.keys(D.distritos).map(Number)));
  const casosDistTodos = {}; casosSemGeo.forEach(id => { const c = D.casos[id]; if (c[5] && (!F.uni || c[1]===F.uni)) casosDistTodos[c[0]] = (casosDistTodos[c[0]]||0)+1; });

  // mapa
  for (const [k,p] of Object.entries(pathEls)) {
    const d = D.distritos[k];
    p.setAttribute('fill', COR_CLASSE[d.c] || '#EAECF0');
    p.style.opacity = geo.has(+k) ? 1 : .22;
    p.classList.toggle('sel', F.dist === +k);
    ligarTip(p, () => `<div class="h">${esc(d.n)}</div>
      ${linha('Subprefeitura', esc(d.s))}
      ${linha('Índice de prioridade', d.idx.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}))}
      ${linha('Prioridade', `<span class="pill p-${d.c==='média'?'media':d.c}">${d.c}</span>`)}
      ${linha('Setores de risco R3/R4', fmt(d.risco))}
      ${linha('Distância ao CRAS', d.cras.toLocaleString('pt-BR',{maximumFractionDigits:1})+' km')}
      ${linha('Famílias no CadÚnico', fmt(d.cad))}
      ${linha('Pessoas acompanhadas (app)', fmt(casosDistTodos[k]||0))}
      <div style="color:#667085;font-size:11px;margin-top:4px">Clique para filtrar</div>`);
  }

  // campanhas (onde agir primeiro)
  const regras = {};
  [...D.alertas].sort((a,b)=>a[4]-b[4]).forEach(([k,regra]) => { (regras[k] ||= []); if (!regras[k].includes(regra)) regras[k].push(regra); });
  const linhasCamp = Object.entries(D.distritos).filter(([k,d]) => geo.has(+k) && (d.c==='urgente' || d.c==='alta'))
     .sort((a,b)=>b[1].idx-a[1].idx);
  $('campanhas').innerHTML = linhasCamp.length ? `<table><thead><tr><th style="width:170px">Distrito</th><th style="width:96px">Prioridade</th><th style="width:70px;text-align:right">Índice ▾</th><th>Campanha</th></tr></thead><tbody>${
    linhasCamp.map(([k,d]) => `<tr data-k="${k}" class="${F.dist===+k?'sel':''}"><td>${esc(d.n)}</td><td><span class="pill p-${d.c==='média'?'media':d.c}">${d.c}</span></td><td class="num">${d.idx.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td>${esc((regras[k]||['Campanha geral']).join(' · '))}</td></tr>`).join('')
  }</tbody></table>` : `<div class="vazio">Nenhum distrito de prioridade urgente ou alta na seleção.<br>Campanhas só são indicadas para prioridade urgente ou alta.</div>`;
  $('campanhas').querySelectorAll('tbody tr').forEach(tr => {
    const k = +tr.dataset.k, d = D.distritos[k];
    tr.onclick = () => escolherDistrito(k);
    ligarTip(tr, () => `<div class="h">${esc(d.n)}</div>${linha('Subprefeitura', esc(d.s))}${linha('Índice', d.idx.toLocaleString('pt-BR',{minimumFractionDigits:1}))}${linha('Lacuna estimada (pessoas)', fmt(Math.round(d.lac)))}${linha('Alertas no distrito', fmt(D.alertas.filter(a=>a[0]===k).length))}`);
  });

  // situação dos direitos por programa (ignora o filtro de programa para destacar)
  const casosSP = casosFiltrados(geo, 'prog');
  const sit = {}; ORDEM_PROG.forEach(p => sit[progId[p]] = D.SIT.map(()=>0));
  D.itens.forEach(([c,p,s]) => { if (casosSP.has(c)) sit[p][s]++; });
  const el = $('situacao');
  el.innerHTML = `<div class="legend" style="margin-bottom:12px">${D.SIT.map(s=>`<span class="lg"><i style="background:${COR_SIT[s]}"></i>${s}</span>`).join('')}</div>`;
  const hRow = 34, gap = 8;
  ORDEM_PROG.forEach(nome => {
    const id = progId[nome], v = sit[id], tot = v.reduce((a,b)=>a+b,0);
    const row = document.createElement('div');
    row.className = 'brow' + (F.prog && F.prog!==id ? ' dim' : '');
    row.style.height = hRow+'px'; row.style.marginBottom = gap+'px';
    row.innerHTML = `<div class="lbl" style="width:150px">${esc(nome)}</div><div class="bar">${
      tot ? D.SIT.map((s,i) => v[i] ? `<div class="seg" data-i="${i}" style="flex:0 0 ${v[i]/tot*100}%;background:${COR_SIT[s]};color:${TXT_SIT[s]||'#fff'}">${v[i]/tot*400 > 26 ? pct(v[i]/tot) : ''}</div>` : '').join('') : '<span class="dval">sem dados</span>'
    }</div>`;
    row.onclick = () => { F.prog = F.prog===id ? null : id; render(); };
    row.querySelectorAll('.seg').forEach(sg => {
      const i = +sg.dataset.i;
      ligarTip(sg, () => `<div class="h">${esc(nome)}</div>${linha(D.SIT[i], fmt(v[i])+' direitos')}${linha('% do programa', pct(v[i]/tot,1))}${linha('Direitos sugeridos', fmt(tot))}`);
    });
    el.appendChild(row);
  });

  // documentos que faltam
  const casosSD = casosFiltrados(geo, 'doc');
  const porDoc = D.DOCS.map(()=>new Set());
  D.docs.forEach(([c,d]) => { if (casosSD.has(c)) porDoc[d].add(c); });
  const ordDoc = D.DOCS.map((n,i)=>[n,i,porDoc[i].size]).sort((a,b)=>b[2]-a[2]);
  const maxDoc = Math.max(1, ...ordDoc.map(x=>x[2]));
  const ed = $('documentos'); ed.innerHTML = '';
  ordDoc.forEach(([n,i,v]) => {
    const row = document.createElement('div');
    row.className = 'brow' + (F.doc!==null && F.doc!==i ? ' dim' : '');
    row.style.height = '26px'; row.style.marginBottom = '22px';
    row.innerHTML = `<div class="lbl" style="width:150px" title="${esc(n)}">${esc(n)}</div><div style="flex:1;display:flex;align-items:center;height:100%"><div class="dbar" style="width:${v/maxDoc*78}%"></div><span class="dval">${fmt(v)}</span></div>`;
    row.onclick = () => { F.doc = F.doc===i ? null : i; render(); };
    ligarTip(row, () => `<div class="h">${esc(n)}</div>${linha('Pessoas com o documento pendente', fmt(v))}<div style="color:#667085;font-size:11px;margin-top:4px">Clique para filtrar</div>`);
    ed.appendChild(row);
  });

  // encaminhamentos por destino
  const casosSE = casosFiltrados(geo, 'dest');
  const porDest = D.DEST.map(()=>D.RES.map(()=>0));
  D.enc.forEach(([c,p,de,r,l]) => { if (casosSE.has(c) && progOk(p) && (F.lem===null || l===F.lem)) porDest[de][r]++; });
  const ordDest = D.DEST.map((n,i)=>[n,i,porDest[i].reduce((a,b)=>a+b,0)]).sort((a,b)=>b[2]-a[2]);
  const ee = $('encaminhamentos'); ee.innerHTML = '';
  ordDest.forEach(([n,i,tot]) => {
    const v = porDest[i];
    const row = document.createElement('div');
    row.className = 'brow' + (F.dest!==null && F.dest!==i ? ' dim' : '');
    row.style.height = '34px'; row.style.marginBottom = '17px';
    row.innerHTML = `<div class="lbl" style="width:82px">${esc(n)}</div><div class="bar">${
      tot ? D.RES.map((r,j) => v[j] ? `<div class="seg" data-j="${j}" style="flex:0 0 ${v[j]/tot*100}%;background:${COR_RES[r]};color:#fff">${v[j]/tot*250 > 44 ? pct(v[j]/tot,2) : ''}</div>` : '').join('') : '<span class="dval">sem dados</span>'
    }</div>`;
    row.onclick = () => { F.dest = F.dest===i ? null : i; render(); };
    row.querySelectorAll('.seg').forEach(sg => {
      const j = +sg.dataset.j;
      ligarTip(sg, () => `<div class="h">${esc(n)}</div>${linha(D.RES[j], fmt(v[j]))}${linha('% do destino', pct(v[j]/tot,2))}${linha('Encaminhamentos', fmt(tot))}`);
    });
    ee.appendChild(row);
  });
  const leg = document.createElement('div'); leg.className='legend'; leg.style.marginTop='2px';
  leg.innerHTML = D.RES.map(r=>`<span class="lg"><i style="background:${COR_RES[r]}"></i>${r}</span>`).join('');
  ee.appendChild(leg);

  // matriz renda × faixa etária (pessoas com direito sem acesso, todos os casos)
  const m = D.REN.map(()=>D.ETA.map(()=>new Set()));
  D.itens.forEach(([c,p,s]) => { if (casos.has(c) && progOk(p) && D.SIT[s]!=='Já recebe') { const k = D.casos[c]; m[k[3]][k[2]].add(c); } });
  const colTot = D.ETA.map((_,j)=>new Set()), linTot = D.REN.map(()=>new Set()), tudo = new Set();
  m.forEach((row,i)=>row.forEach((s,j)=>s.forEach(c=>{colTot[j].add(c);linTot[i].add(c);tudo.add(c);})));
  $('matriz').innerHTML = `<table><thead><tr><th>Renda por pessoa</th>${D.ETA.map(e=>`<th>${e}</th>`).join('')}<th>Total</th></tr></thead><tbody>${
    D.REN.map((r,i)=>`<tr><td>${esc(r)}</td>${D.ETA.map((e,j)=>`<td class="cell" data-i="${i}" data-j="${j}">${m[i][j].size?fmt(m[i][j].size):''}</td>`).join('')}<td class="t">${fmt(linTot[i].size)}</td></tr>`).join('')
  }<tr class="tot"><td>Total</td>${colTot.map(s=>`<td>${fmt(s.size)}</td>`).join('')}<td>${fmt(tudo.size)}</td></tr></tbody></table>`;
  $('matriz').querySelectorAll('td.cell').forEach(td => {
    const i = +td.dataset.i, j = +td.dataset.j;
    ligarTip(td, () => `<div class="h">Renda ${esc(D.REN[i])} · ${D.ETA[j]} anos</div>${linha('Pessoas com direito sem acesso', fmt(m[i][j].size))}${linha('% da faixa de renda', linTot[i].size?pct(m[i][j].size/linTot[i].size,1):'–')}`);
  });

  // alertas cruzados
  const gOrd = {alta:0,'média':1,baixa:2};
  const al = D.alertas.filter(a => geo.has(a[0])).sort((a,b)=>(gOrd[a[3]]-gOrd[b[3]]) || a[2].localeCompare(b[2],'pt'));
  $('alertas').innerHTML = al.length ? `<table><thead><tr><th style="width:87px">gravidade</th><th>alerta</th></tr></thead><tbody>${
    al.map(a=>`<tr data-k="${a[0]}" class="${F.dist===a[0]?'sel':''}"><td><span class="pill p-${a[3]==='média'?'media':a[3]==='alta'?'urgente':'baixa'}">${a[3]}</span></td><td>${esc(a[2])}</td></tr>`).join('')
  }</tbody></table>` : '<div class="vazio">Nenhum alerta para a seleção.</div>';
  $('alertas').querySelectorAll('tbody tr').forEach((tr,ix) => {
    const a = al[ix];
    tr.onclick = () => escolherDistrito(a[0]);
    ligarTip(tr, () => `<div class="h">${esc(D.distritos[a[0]].n)}</div>${linha('Regra', esc(a[1]))}${linha('Gravidade', a[3])}`);
  });

  // efetividade do atendimento: comparecimento por recebimento de lembrete
  const casosSL = casosFiltrados(geo, 'lem');
  const porLem = D.LEM.map(()=>D.RES.map(()=>0));
  D.enc.forEach(([c,p,de,r,l]) => { if (casosSL.has(c) && progOk(p) && (F.dest===null || de===F.dest)) porLem[l][r]++; });
  const somaL = v => v.reduce((a,b)=>a+b,0);
  const comL = D.RES.map((_,j)=>porLem[0][j]+porLem[1][j]+porLem[2][j]), semL = porLem[3];
  const taxa = (v,j) => somaL(v) ? v[j]/somaL(v) : 0;
  const iF = D.RES.indexOf('Faltou');
  const ef = $('efetividade');
  ef.innerHTML = `<div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1;background:#ECFDF3;border-radius:8px;padding:8px 12px"><div style="font-size:11px;color:#475467">Faltas com lembrete</div><div style="font-size:22px;font-weight:600;color:#067647">${somaL(comL)?pct(taxa(comL,iF)):'–'}</div></div>
      <div style="flex:1;background:#FEF3F2;border-radius:8px;padding:8px 12px"><div style="font-size:11px;color:#475467">Faltas sem lembrete</div><div style="font-size:22px;font-weight:600;color:#B42318">${somaL(semL)?pct(taxa(semL,iF)):'–'}</div></div>
      <div style="flex:1.2;background:#F2F4F7;border-radius:8px;padding:8px 12px"><div style="font-size:11px;color:#475467">Diferença</div><div style="font-size:22px;font-weight:600">${somaL(comL)&&somaL(semL)?((taxa(semL,iF)-taxa(comL,iF))*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+' p.p.':'–'}</div></div>
    </div>`;
  const rotL = ['Lembrete em texto','Lembrete em áudio','Texto e áudio','Sem lembrete'];
  D.LEM.forEach((n,i) => {
    const v = porLem[i], tot = somaL(v);
    const row = document.createElement('div');
    row.className = 'brow' + (F.lem!==null && F.lem!==i ? ' dim' : '');
    row.style.height = '27px'; row.style.marginBottom = '9px';
    row.innerHTML = `<div class="lbl" style="width:118px">${rotL[i]}</div><div class="bar">${
      tot ? D.RES.map((r,j) => v[j] ? `<div class="seg" data-j="${j}" style="flex:0 0 ${v[j]/tot*100}%;background:${COR_RES[r]};color:#fff">${v[j]/tot*460 > 36 ? pct(v[j]/tot) : ''}</div>` : '').join('') : '<span class="dval">sem dados</span>'
    }</div>`;
    row.onclick = () => { F.lem = F.lem===i ? null : i; render(); };
    row.querySelectorAll('.seg').forEach(sg => {
      const j = +sg.dataset.j;
      ligarTip(sg, () => `<div class="h">${rotL[i]}</div>${linha(D.RES[j], fmt(v[j]))}${linha('% dos encaminhamentos', pct(v[j]/tot,1))}${linha('Encaminhamentos', fmt(tot))}`);
    });
    ef.appendChild(row);
  });
  const legE = document.createElement('div'); legE.className='legend'; legE.style.marginTop='4px';
  legE.innerHTML = D.RES.map(r=>`<span class="lg"><i style="background:${COR_RES[r]}"></i>${r}</span>`).join('');
  ef.appendChild(legE);

  // cobertura dos lembretes: disponibilidade de WhatsApp × adesão, por faixa etária (casos ativos)
  const COR_COB = ['#12B76A','#84ADFF','#FEC84B','#9B9FA6'];
  const casosSC = casosFiltrados(geo, 'cob');
  const cobM = D.ETA.map(()=>D.COB.map(()=>0)); const cobT = D.COB.map(()=>0);
  casosSC.forEach(id => { const c = D.casos[id]; if (c[5]) { cobM[c[2]][c[6]]++; cobT[c[6]]++; } });
  const totC = somaL(cobT), recebem = cobT[0]+cobT[1];
  const co = $('cobertura');
  co.innerHTML = `<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px"><span style="font-size:22px;font-weight:600;color:#067647">${totC?pct(recebem/totC):'–'}</span><span style="font-size:12px;color:#475467">das pessoas acompanhadas recebem lembretes (${fmt(recebem)} de ${fmt(totC)})</span></div>
    <div class="legend" style="margin-bottom:10px">${D.COB.map((n,k)=>`<span class="lg"><i style="background:${COR_COB[k]}"></i>${n}</span>`).join('')}</div>`;
  [...D.ETA.map((e,i)=>[e+' anos',cobM[i]]), ['Total',cobT]].forEach(([nome,v],ix) => {
    const tot = somaL(v);
    const row = document.createElement('div');
    row.className = 'brow';
    row.style.height = '24px'; row.style.marginBottom = '7px';
    if (nome==='Total') { row.style.marginTop='12px'; }
    row.innerHTML = `<div class="lbl" style="width:76px;${nome==='Total'?'font-weight:600;color:#101828':''}">${nome}</div><div class="bar">${
      tot ? D.COB.map((n,k) => v[k] ? `<div class="seg" data-k="${k}" style="flex:0 0 ${v[k]/tot*100}%;background:${COR_COB[k]};color:${k===2?'#101828':'#fff'};opacity:${F.cob!==null&&F.cob!==k?.3:1}">${v[k]/tot*590 > 34 ? pct(v[k]/tot) : ''}</div>` : '').join('') : '<span class="dval">sem dados</span>'
    }</div>`;
    row.querySelectorAll('.seg').forEach(sg => {
      const k = +sg.dataset.k;
      sg.onclick = () => { F.cob = F.cob===k ? null : k; render(); };
      ligarTip(sg, () => `<div class="h">${nome}</div>${linha(D.COB[k], fmt(v[k])+' pessoas')}${linha('% da faixa', pct(v[k]/tot,1))}${linha('Pessoas acompanhadas', fmt(tot))}<div style="color:#667085;font-size:11px;margin-top:4px">Clique para filtrar</div>`);
    });
    co.appendChild(row);
  });
}

/* ---------- escala para caber na tela ---------- */
function ajustar(){
  const w = document.documentElement.clientWidth;
  const s = Math.min(w / 1440, 1.35);
  $('stage').style.transform = `scale(${s})`;
  $('wrap').style.height = (1926 * s) + 'px';
  $('stage').style.left = Math.max(0, (w - 1440*s)/2) + 'px';
}
addEventListener('resize', ajustar);
ajustar();
render();
</script>
</body>
</html>
